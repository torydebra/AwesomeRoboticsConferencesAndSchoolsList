name: Validate JSONs

on:
  pull_request:
    branches: ["master"]

  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  verify-json-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            www/data
      - name: Validate JSON
        uses: docker://orrosenblatt/validate-json-action:latest
        env:
          INPUT_SCHEMA: www/data/schema.json
          INPUT_JSONS: www/data/conf2026.json,www/data/school2026.json,www/data/conf2027.json,www/data/school2027.json,www/data/conf2028.json,www/data/school2028.json,www/data/conf2029.json,www/data/school2029.json
